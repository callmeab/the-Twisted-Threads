<!-- Premium Sticky Header -->
<header
  [ngClass]="{ 'scrolled-header': isScrolled(), 'transparent-header': !isScrolled() }"
  class="fixed top-0 left-0 right-0 z-50 w-full transition-all duration-300"
>
  <div class="mx-auto flex h-20 items-center justify-between px-4 lg:px-8 max-w-8xl">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 logo-link shrink-0" (click)="mobileNav.close()">
      <img src="images/full-logo.png" alt="The Twisted Threads Logo" style="height: 70px; width: auto; max-width: 250px; object-fit: contain;">
    </a>

    <!-- Desktop navigation -->
    <nav class="hidden lg:flex items-center gap-6 xl:gap-8 text-sm uppercase tracking-widest font-semibold text-charcoal">
      <a routerLink="/" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        Home
      </a>
      <a routerLink="/products" routerLinkActive="active-nav-link" class="nav-link">Shop</a>
      
      <!-- Inline CSS Dropdown for Collections -->
      <div class="nav-dropdown-wrapper">
        <button class="nav-link flex items-center gap-1 border-none cursor-pointer bg-transparent">
          Collections
          <mat-icon class="text-xs transition-transform duration-200 dropdown-arrow">keyboard_arrow_down</mat-icon>
        </button>
        <div class="nav-dropdown-menu">
          <a routerLink="/products" [queryParams]="{ category: 'Necklaces' }" class="nav-dropdown-item">
            <mat-icon class="text-rose-gold text-sm mr-2">diamond</mat-icon>
            Artisan Necklaces
          </a>
          <a routerLink="/products" [queryParams]="{ category: 'Bracelets' }" class="nav-dropdown-item">
            <mat-icon class="text-rose-gold text-sm mr-2">watch</mat-icon>
            Fine Bracelets
          </a>
          <a routerLink="/products" [queryParams]="{ category: 'Earrings' }" class="nav-dropdown-item">
            <mat-icon class="text-rose-gold text-sm mr-2">auto_awesome</mat-icon>
            Elegant Earrings
          </a>
          <a routerLink="/products" [queryParams]="{ category: 'Sets' }" class="nav-dropdown-item">
            <mat-icon class="text-rose-gold text-sm mr-2">interests</mat-icon>
            Custom Sets
          </a>
        </div>
      </div>

      <a routerLink="/about" routerLinkActive="active-nav-link" class="nav-link">About</a>
      <a routerLink="/contact" routerLinkActive="active-nav-link" class="nav-link">Contact</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-2 sm:gap-4 shrink-0">
      <div class="hidden sm:block header-search-wrap">
        <app-search-bar />
      </div>

      <!-- Hidden User/Profile Icon -->
      <!-- <button class="action-btn hidden" aria-label="Account">
        <mat-icon>person_outline</mat-icon>
      </button> -->

      <a
        routerLink="/wishlist"
        class="action-btn hidden sm:inline-flex"
        matBadge="{{ wishlistService.count() }}"
        matBadgeColor="accent"
        [matBadgeHidden]="wishlistService.count() === 0"
        aria-label="Wishlist"
      >
        <mat-icon>{{ wishlistService.count() > 0 ? 'favorite' : 'favorite_border' }}</mat-icon>
      </a>

      <a
        routerLink="/cart"
        class="action-btn hidden sm:inline-flex"
        matBadge="{{ cartService.totalItems() }}"
        matBadgeColor="primary"
        [matBadgeHidden]="cartService.totalItems() === 0"
        aria-label="Cart"
      >
        <mat-icon>shopping_bag</mat-icon>
      </a>

      <app-hamburger-button
        class="lg:hidden"
        [isOpen]="mobileNav.isOpen()"
        (toggled)="toggleMobileMenu()"
      />
    </div>
  </div>
</header>

<app-mobile-menu />
