<div
  class="star-rating"
  [class.star-rating--readonly]="readonly()"
  [class.star-rating--sm]="size() === 'sm'"
  [class.star-rating--lg]="size() === 'lg'"
  role="group"
  [attr.aria-label]="'Rating: ' + value() + ' out of 5 stars'"
>
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [class.filled]="isFilled(star)"
      [class.animate-pop]="isAnimated(star)"
      [disabled]="readonly()"
      (mouseenter)="onEnter(star)"
      (mouseleave)="onLeave()"
      (click)="onSelect(star)"
      [attr.aria-label]="star + ' star' + (star > 1 ? 's' : '')"
    >
      <span class="material-icons star-icon">star</span>
    </button>
  }
  @if (showLabel() && value() > 0) {
    <span class="star-label">{{ value() }}/5</span>
  }
</div>
