<!-- Stunning Full-Screen Hero Slideshow -->
<section class="relative w-full h-screen overflow-hidden bg-charcoal">
  
  <!-- Swiper Full-Screen Background Carousel -->
  <swiper-container
    effect="fade"
    autoplay='{"delay": 6000, "disableOnInteraction": false, "pauseOnHover": true}'
    loop="true"
    speed="1400"
    class="w-full h-full"
  >
    <!-- Slide 1 -->
    <swiper-slide class="w-full h-full relative">
      <div 
        class="absolute inset-0 bg-cover bg-center transition-transform duration-100 ease-out"
        [ngStyle]="{ 
          'background-image': 'url(https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=1600)', 
          'transform': 'translateY(' + (scrollY() * 0.35) + 'px)' 
        }"
      ></div>
      <div class="absolute inset-0 bg-neutral-950/65 backdrop-brightness-[0.7]"></div>
    </swiper-slide>

    <!-- Slide 2 -->
    <swiper-slide class="w-full h-full relative">
      <div 
        class="absolute inset-0 bg-cover bg-center transition-transform duration-100 ease-out"
        [ngStyle]="{ 
          'background-image': 'url(https://images.unsplash.com/photo-1606722590583-6951b5ea92ad?q=80&w=1600)', 
          'transform': 'translateY(' + (scrollY() * 0.35) + 'px)' 
        }"
      ></div>
      <div class="absolute inset-0 bg-neutral-950/65 backdrop-brightness-[0.7]"></div>
    </swiper-slide>

    <!-- Slide 3 -->
    <swiper-slide class="w-full h-full relative">
      <div 
        class="absolute inset-0 bg-cover bg-center transition-transform duration-100 ease-out"
        [ngStyle]="{ 
          'background-image': 'url(https://images.unsplash.com/photo-1509281373149-e957c6296406?q=80&w=1600)', 
          'transform': 'translateY(' + (scrollY() * 0.35) + 'px)' 
        }"
      ></div>
      <div class="absolute inset-0 bg-neutral-950/65 backdrop-brightness-[0.7]"></div>
    </swiper-slide>

    <!-- Slide 4 -->
    <swiper-slide class="w-full h-full relative">
      <div 
        class="absolute inset-0 bg-cover bg-center transition-transform duration-100 ease-out"
        [ngStyle]="{ 
          'background-image': 'url(https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1600)', 
          'transform': 'translateY(' + (scrollY() * 0.35) + 'px)' 
        }"
      ></div>
      <div class="absolute inset-0 bg-neutral-950/65 backdrop-brightness-[0.7]"></div>
    </swiper-slide>
  </swiper-container>

  <!-- Elegant Centered Content Overlay -->
  <div class="absolute inset-0 z-10 flex flex-col items-center justify-center text-center px-6">
    <span class="animate-fade-in text-[10px] tracking-[0.25em] font-semibold text-gold uppercase border border-gold/30 rounded-full px-4 py-1.5 mb-6 bg-purple/20 backdrop-blur-sm">
      Autumn Collection 2026
    </span>
    <h1 class="animate-slide-up font-heading tracking-wide text-4xl sm:text-7xl font-bold text-pearl leading-none max-w-4xl">
      Handcrafted Elegance, <br />
      <span class="gradient-rose-gold">Just for You</span>
    </h1>
    <p class="animate-fade-in font-serif text-sm sm:text-lg text-cream/80 max-w-2xl mt-6 leading-relaxed font-light">
      Explore our private boutique of hand-twisted gold threads, organic fabrics, and luxury textiles spun by master weavers into pure, wearable art.
    </p>
    
    <!-- CTA Actions -->
    <div class="animate-slide-up flex flex-col sm:flex-row gap-4 mt-8">
      <a routerLink="/products" class="btn-primary-luxury px-8 py-3.5 text-xs font-semibold uppercase tracking-widest rounded-lg transition-all duration-300">
        Shop Collection
      </a>
      <a routerLink="/about" class="btn-outline-luxury px-8 py-3.5 text-xs font-semibold uppercase tracking-widest rounded-lg backdrop-blur-sm transition-all duration-300">
        Discover Story
      </a>
    </div>
  </div>

  <!-- Animated Scroll Down Indicator -->
  <button 
    (click)="scrollToFeatured()" 
    class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-2 cursor-pointer bg-transparent border-none text-pearl/50 hover:text-gold transition-colors duration-300" 
    aria-label="Scroll Down">
    <span class="font-body text-[9px] uppercase tracking-widest font-semibold">Scroll Down</span>
    <div class="scroll-arrow-box">
      <div class="scroll-dot"></div>
    </div>
  </button>
</section>

<div id="featured-section">
  <app-featured-products></app-featured-products>
</div>
